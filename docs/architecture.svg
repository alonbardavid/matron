<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1478 700" width="1478" height="700" role="img" aria-labelledby="title desc" font-family='Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'>
  <title id="title">Matron's architecture</title>
  <desc id="desc">Every request reaches the router in the main Worker. On main the router calls the application in the same Worker, which uses the app tables of the production D1; the router uses the router tables. On a branch it sends the request to that branch's Preview Worker, which runs the branch's application on the app tables of its own D1; the branch box is drawn as a stack, since there can be several. The builder runs builds in its container, which pushes to the Artifacts repository, deploys the Preview and clones the database.</desc>
  <style>
    .group { fill: #f3eaef; stroke: #c9b3c0; stroke-width: 1.5; stroke-dasharray: 2 6; stroke-linecap: round; }
    .worker { fill: #ffffff; stroke: #240a1c; stroke-width: 1.75; }
    .part { fill: #faf6f8; stroke: #c9b3c0; stroke-width: 1.5; }
    .router { fill: #fbe3f0; stroke: #b9086e; stroke-width: 1.75; }
    .store { fill: #ffffff; stroke: #c9b3c0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #6d5262; stroke-width: 1.75; }
    .route { fill: none; stroke: #b9086e; stroke-width: 2.5; }
    .build { fill: none; stroke: #6d5262; stroke-width: 1.75; stroke-dasharray: 7 6; }
    .head { fill: #6d5262; }
    .head-route { fill: #b9086e; }
    .t-group { fill: #6d5262; font-size: 13px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; }
    .t-title { fill: #240a1c; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
    .t-name { fill: #240a1c; font-size: 17px; font-weight: 600; }
    .t-cell { fill: #240a1c; font-size: 14px; font-weight: 600; }
    .t-sub { fill: #6d5262; font-size: 13.5px; }
    .t-edge { fill: #6d5262; font-size: 13.5px; font-weight: 500; }
    .t-route { fill: #b9086e; font-size: 14px; font-weight: 600; }
    .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 500; font-size: 13.5px; }
  </style>
  <rect width="1478" height="700" rx="16" fill="#faf6f8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 Z"/></marker>
    <marker id="arrow-route" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="head-route" d="M0 0 L10 5 L0 10 Z"/></marker>
  </defs>
  <rect class="group" x="210" y="20" width="740" height="660" rx="18"/>
  <text class="t-group" x="232" y="48">Production</text>
  <rect class="group" x="1178" y="48" width="280" height="520" rx="18"/>
  <rect class="group" x="1164" y="34" width="280" height="520" rx="18"/>
  <rect class="group" x="1150" y="20" width="280" height="520" rx="18"/>
  <text class="t-group" x="1172" y="48">Branch</text>
  <rect class="worker" x="230" y="62" width="700" height="246" rx="14"/>
  <text class="t-title" x="254" y="94">Main Worker</text>

  <rect class="router" x="254" y="112" width="176" height="172" rx="10"/>
  <text class="t-name" x="342" y="204" text-anchor="middle">Router</text>

  <rect class="part" x="526" y="200" width="176" height="84" rx="10"/>
  <text class="t-name" x="614" y="238" text-anchor="middle">Application</text>
  <text class="t-sub" x="614" y="260" text-anchor="middle">main code</text>

  <rect class="part" x="750" y="200" width="160" height="84" rx="10"/>
  <text class="t-name" x="830" y="238" text-anchor="middle">Builder</text>
  <text class="t-sub" x="830" y="260" text-anchor="middle">Durable Object</text>
  <rect class="worker" x="1170" y="62" width="240" height="164" rx="14"/>
  <text class="t-title" x="1194" y="94">Preview Worker</text>
  <rect class="part" x="1194" y="118" width="192" height="84" rx="10"/>
  <text class="t-name" x="1290" y="156" text-anchor="middle">Application</text>
  <text class="t-sub" x="1290" y="178" text-anchor="middle">branch code</text>
  <rect class="store" x="254" y="380" width="448" height="136" rx="10"/>
  <rect class="part" x="270" y="396" width="192" height="78" rx="8"/>
  <text class="t-cell" x="366" y="424" text-anchor="middle">Router tables</text>
  <text class="t-sub" x="366" y="444" text-anchor="middle">users, sessions,</text>
  <text class="t-sub" x="366" y="462" text-anchor="middle">branches, build sessions</text>
  <rect class="part" x="494" y="396" width="192" height="78" rx="8"/>
  <text class="t-cell" x="590" y="424" text-anchor="middle">App tables</text>
  <text class="t-sub" x="590" y="444" text-anchor="middle">lists, calendars,</text>
  <text class="t-sub" x="590" y="462" text-anchor="middle">files, reminders</text>
  <text class="t-name" x="478" y="501" text-anchor="middle">Production D1</text>
  <rect class="store" x="1194" y="380" width="192" height="136" rx="10"/>
  <rect class="part" x="1210" y="396" width="160" height="78" rx="8"/>
  <text class="t-cell" x="1290" y="424" text-anchor="middle">App tables</text>
  <text class="t-sub" x="1290" y="444" text-anchor="middle">lists, calendars,</text>
  <text class="t-sub" x="1290" y="462" text-anchor="middle">files, reminders</text>
  <text class="t-name" x="1290" y="501" text-anchor="middle">Branch D1</text>
  <rect class="store" x="740" y="380" width="180" height="136" rx="10"/>
  <text class="t-name" x="830" y="434" text-anchor="middle">Builder container</text>
  <text class="t-sub" x="830" y="458" text-anchor="middle">coding agent, tests,</text>
  <text class="t-sub" x="830" y="477" text-anchor="middle">wrangler</text>

  <rect class="store" x="740" y="586" width="180" height="76" rx="10"/>
  <text class="t-name" x="830" y="620" text-anchor="middle">Artifacts</text>
  <text class="t-sub" x="830" y="642" text-anchor="middle">git: main and branches</text>
  <rect class="part" x="16" y="160" width="104" height="60" rx="10"/>
  <text class="t-name" x="68" y="196" text-anchor="middle">Browser</text>
  <line class="route" x1="120" y1="190" x2="250" y2="190" marker-end="url(#arrow-route)"/>
  <text class="t-route" x="165" y="178" text-anchor="middle">request</text>
  <line class="route" x1="430" y1="160" x2="1190" y2="160" marker-end="url(#arrow-route)"/>
  <text class="t-route t-mono" x="446" y="148">?branch=task-stars</text>
  <line class="route" x1="430" y1="242" x2="522" y2="242" marker-end="url(#arrow-route)"/>
  <text class="t-route" x="476" y="231" text-anchor="middle">main</text>
  <line class="edge" x1="366" y1="284" x2="366" y2="392" marker-end="url(#arrow)"/>
  <line class="edge" x1="590" y1="284" x2="590" y2="392" marker-end="url(#arrow)"/>
  <line class="edge" x1="1290" y1="202" x2="1290" y2="392" marker-end="url(#arrow)"/>
  <line class="build" x1="830" y1="284" x2="830" y2="376" marker-end="url(#arrow)"/>
  <text class="t-edge" x="840" y="350">runs a build</text>
  <line class="build" x1="830" y1="516" x2="830" y2="582" marker-end="url(#arrow)"/>
  <line class="build" x1="920" y1="448" x2="1146" y2="448" marker-end="url(#arrow)"/>
  <text class="t-edge" x="962" y="435">deploys the Preview,</text>
  <text class="t-edge" x="962" y="469">clones DB</text>
</svg>
