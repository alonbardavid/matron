<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Branch not found</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: #1f2a24;
        background: #f6f5f1;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: #4a564f;
      }
      a {
        display: inline-block;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        background: #1f2a24;
        color: #fff;
        text-decoration: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #e8e6e0;
          background: #1a1d1b;
        }
        p {
          color: #a9b0ab;
        }
        a {
          background: #e8e6e0;
          color: #1a1d1b;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This branch does not exist</h1>
      <p>It may have been merged or abandoned, or the link is wrong.</p>
      <a href="/">Go to main</a>
    </main>
  </body>
</html>
